
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Mode Offline - E-Perpustakaan</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #26352b;
      text-align: center;
    }
    .card {
      max-width: 430px;
      padding: 35px 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    .icon { font-size: 60px; }
    h1 { color: #14532d; font-size: 24px; }
    p { line-height: 1.7; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 24px;
      background: #14532d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📚</div>
    <h1>E-Perpustakaan MTSS Darul Islam Siak</h1>
    <p>
      Saat ini perangkat om sedang tidak terhubung ke internet.
      Silakan periksa koneksi internet dan coba buka kembali aplikasi.
    </p>
    <button onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
